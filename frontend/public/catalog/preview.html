<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>catalog preview</title>
    <style>
      body { margin: 0; background: #0a0d14; font-family: ui-sans-serif; }
      .grid { display: grid; grid-template-columns: repeat(4, 240px); gap: 16px; padding: 24px; }
      .cell { position: relative; width: 240px; height: 300px; background: #121a26; border: 1px solid #263041; }
      .cell img { width: 100%; height: 100%; object-fit: contain; display: block; }
      .cell::before { content: ''; position: absolute; inset: 0; background:
        linear-gradient(to right, rgba(214,189,128,.18) 1px, transparent 1px) 0 0 / 60px 60px,
        linear-gradient(to bottom, rgba(214,189,128,.18) 1px, transparent 1px) 0 0 / 60px 60px; }
      .tag { position: absolute; left: 6px; top: 4px; font-size: 11px; color: #d6bd80; z-index: 2; }
      .mid::after { content: ''; position: absolute; left: 50%; top: 0; bottom: 0; border-left: 1px dashed rgba(255,80,120,.7); }
    </style>
  </head>
  <body>
    <div class="grid" id="grid"></div>
    <script>
      const grid = document.getElementById('grid')
      for (let i = 1; i <= 12; i++) {
        const cell = document.createElement('div')
        cell.className = 'cell mid'
        cell.innerHTML = '<span class="tag">' + i + '</span><img src="./' + i + '.svg" alt="">'
        grid.appendChild(cell)
      }
    </script>
  </body>
</html>
