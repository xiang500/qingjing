spring.datasource.url=jdbc:mysql://localhost:3306/chuaizhibeidatabase?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&zeroDateTimeBehavior=convertToNull
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
# 配置别名 该指定路径下的所以实体类的类定义别名（类名首字母变小写就是别名）
mybatis-plus.type-aliases-package=com.czit.entity
# 应用服务 WEB 访问端口
server.port=8080

# ===== 轻境业务所需的附加配置（原 backend/src/main/resources/application.yml 迁移） =====
spring.application.name=qingjing-server
spring.jackson.time-zone=Asia/Shanghai
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.default-property-inclusion=non_null
spring.mvc.problemdetails.enabled=false

mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.global-config.banner=false
mybatis-plus.global-config.db-config.id-type=auto
mybatis-plus.global-config.db-config.logic-delete-field=deleted
mybatis-plus.global-config.db-config.logic-delete-value=1
mybatis-plus.global-config.db-config.logic-not-delete-value=0

logging.level.com.czit=debug

# AI 通道：配置了 Key 走 DeepSeek，未配置时自动退化为本地策略引擎
qingjing.auth.secret=${QINGJING_JWT_SECRET:qingjing-dev-secret-change-me-in-production-2026}
qingjing.auth.ttl-hours=168
qingjing.ai.api-key=${DEEPSEEK_API_KEY:}
qingjing.ai.base-url=${DEEPSEEK_BASE_URL:https://api.deepseek.com}
qingjing.ai.model=${DEEPSEEK_MODEL:deepseek-chat}
qingjing.ai.temperature=0.7
qingjing.ai.max-tokens=900
qingjing.ai.timeout-seconds=60
qingjing.ai.knowledge-top-k=3
qingjing.ai.max-tool-rounds=3